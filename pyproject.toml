[project]
name = "pond"
version = "0.1.0"
description = "POND — a local-first personal data warehouse. Import your exports, query your life."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Charan" }]
dependencies = [
    "duckdb>=1.1",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "sqlglot>=25.0",
    "python-dateutil>=2.9",
    "icalendar>=5.0",
]

[project.scripts]
pond = "pond.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pond"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/pond/cli.py" = ["B008"]  # typer's declarative defaults are call expressions

[tool.pytest.ini_options]
testpaths = ["tests"]
